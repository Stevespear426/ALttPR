name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          B64_KEYSTORE: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        if: env.B64_KEYSTORE != ''
        run: |
          echo "$B64_KEYSTORE" | base64 --decode > release.keystore

      - name: Build Android Pro
        run: |
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace
          ./gradlew :androidApp:bundleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
          keyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
          storeFile: ../release.keystore
          storePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-builds
          path: |
            androidApp/build/outputs/apk/*/*.apk
            androidApp/build/outputs/bundle/release/*.aab

  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Desktop (macOS)
        if: matrix.os == 'macos-latest'
        run: ./gradlew :desktopApp:packageDmg --no-daemon

      - name: Build Desktop (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew :desktopApp:packageMsi --no-daemon

      - name: Build Desktop (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :desktopApp:packageDeb --no-daemon

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-builds-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/deb/*.deb

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Archive iOS
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            archive -archivePath $RUNNER_TEMP/ALTTPR.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Prepare IPA
        run: |
          mkdir -p build/ios/ipa
          pushd $RUNNER_TEMP/ALTTPR.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R *.app Payload/
          zip -r $GITHUB_WORKSPACE/build/ios/ipa/ALTTPR.ipa Payload
          popd

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-builds
          path: build/ios/ipa/*.ipa

      - name: Upload iOS Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
